name: Trade

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 minutes
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices and trade if due
        env:
          RH_API_KEY: ${{ secrets.RH_API_KEY }}
          RH_PRIVATE_KEY: ${{ secrets.RH_PRIVATE_KEY }}
        run: python bot.py --once

      - name: Save state and log
        if: always()
        run: |
          [ -f bot.log ] && tail -n 1000 bot.log > bot.log.tmp && mv bot.log.tmp bot.log
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add bot_state.json bot.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Bot run $(date -u +%FT%H:%MZ)"
          git push
